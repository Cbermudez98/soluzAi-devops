name: CI

# Integración continua: se ejecuta automáticamente en cada push o pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: .venv/bin/ruff check . --output-format=github

      - name: Formato (ruff format)
        run: .venv/bin/ruff format --check .

  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Pruebas (pytest) con cobertura mínima de 90 %
        run: >-
          .venv/bin/pytest -v
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90
          --junitxml=reports/junit.xml

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            coverage.xml
            reports/junit.xml

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Búsqueda de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Librerías vulnerables (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  build:
    name: Build de la imagen
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t soporteia-api:${{ github.sha }} .

      - name: Smoke test del contenedor
        run: |
          docker run -d --name api -p 8080:8080 soporteia-api:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

      - name: Escaneo de vulnerabilidades de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: soporteia-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
